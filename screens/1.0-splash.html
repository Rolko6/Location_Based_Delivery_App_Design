/* 1.0 Splash (animated) – layout + timeline only.
   Values: tokens.css. Keyframes: components.css (13. SPLASH).
   Story inside the phone: order a coffee → tap → selfie camera → shutter flash
   → order confirmed (check badge pops, customer cheers). */
.splash-brand { position: absolute; left: 0; right: 0; top: 19%; z-index: 1; display: flex; justify-content: center; }
.splash-brand .wordmark { font-size: var(--fs-wordmark); }
.splash-art { position: absolute; width: 144%; left: -56%; bottom: -11%; animation: rise-in var(--dur-enter) var(--ease-out) both; }
.splash-art svg { display: block; width: 100%; height: auto; }
.statusbar, .home-indicator { z-index: 2; }

/* timeline (all transforms on SVG parts use their own box) */
.splash-art .order-button, .splash-art .tap, .splash-art .state-order,
.splash-art .state-selfie, .splash-art .camera-ui .accent { transform-box: fill-box; transform-origin: center; }
.splash-art .order-button { animation: press var(--dur-press) var(--ease-out) var(--splash-tap-at) both; }
.splash-art .tap          { animation: tap-ripple var(--dur-reveal) var(--ease-out) var(--splash-tap-at) both; }
.splash-art .state-order  { animation: leave-up var(--dur-swap) var(--ease-out) var(--splash-swap-at) both; }
.splash-art .state-selfie { animation: settle-in var(--dur-reveal) var(--ease-out) var(--splash-in-at) both,
                                      leave-up var(--dur-swap) var(--ease-out) var(--splash-selfie-out-at) forwards; }
.splash-art .confirm-check, .splash-art .confirm-cheer { transform-box: fill-box; transform-origin: center; }
.splash-art .confirm-check { animation: pop-in var(--dur-reveal) var(--ease-out) var(--splash-confirm-at) both; }
.splash-art .confirm-cheer { animation: rise-fade var(--dur-reveal) var(--ease-out) var(--splash-cheer-at) both; }
.splash-art .camera-ui .accent { animation: press var(--dur-press) var(--ease-out) var(--splash-shutter-at) both; }
.splash-art .flash        { animation: flash var(--dur-flash) var(--ease-out) var(--splash-shutter-at) both; }

/* review-only control outside the phone */
.mock-controls { display: flex; justify-content: center; gap: var(--space-6); padding-top: var(--space-5); }
@media (max-width: 430px) { .mock-controls { display: none; } }
</style>

  });
  document.querySelector('.device').addEventListener('click', function () { location.href = NEXT; });
  document.getElementById('replay').addEventListener('click', function () {
