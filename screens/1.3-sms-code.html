<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoot · 1.3 SMS code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Shrikhand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/icons.js"></script>
<style>
/* 1.3 SMS code – layout only. Values: tokens.css. Components: components.css. */
.flow { padding-bottom: var(--space-4); }
.flow .otp { margin-top: var(--space-8); }
.flow .resend { justify-self: start; margin-top: var(--space-4); padding: 0; }
.flow .screen-footer { margin-top: auto; }
.code-block { display: grid; }
</style>
</head>
<body class="screen-page">

<main class="device" aria-label="1.3 SMS code">
  <div class="statusbar" aria-hidden="true">
    <span>9:41</span>
    <span class="sys">
      <svg class="i"><use href="#i-signal"/></svg>
      <svg class="i"><use href="#i-wifi"/></svg>
      <svg class="i battery"><use href="#i-battery"/></svg>
    </span>
  </div>

  <form class="screen flow" id="code-form" novalidate>
    <header class="page-head">
      <nav class="navbar"><a class="back" href="1.2-phone-number.html" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></a><span></span><span></span></nav>
      <h1 class="page-title">Enter the code</h1>
      <p class="page-lede num">Sent to <span id="sent-to">+358 40 123 4567</span></p>
    </header>

    <div class="code-block">
      <div class="otp" role="group" aria-label="6-digit code">
        <input class="filled" value="4" aria-label="Digit 1" inputmode="none" maxlength="1" autocomplete="one-time-code">
        <input class="filled" value="8" aria-label="Digit 2" inputmode="none" maxlength="1">
        <input class="filled" value="1" aria-label="Digit 3" inputmode="none" maxlength="1">
        <input class="is-focused" aria-label="Digit 4" inputmode="none" maxlength="1">
        <input aria-label="Digit 5" inputmode="none" maxlength="1">
        <input aria-label="Digit 6" inputmode="none" maxlength="1">
      </div>
      <button class="btn-text sm resend num" type="button" id="resend" disabled>Resend code in 0:42</button>
    </div>

    <footer class="screen-footer">
      <button class="btn btn-primary" type="submit">Verify</button>
    </footer>
  </form>

  <div class="keyboard" aria-hidden="true">
    <button class="suggest" type="button" data-fill="481236"><small>From Messages</small><strong>481 236</strong></button>
    <div class="keys">
      <button class="key" type="button" data-key="1">1<small>&nbsp;</small></button>
      <button class="key" type="button" data-key="2">2<small>ABC</small></button>
      <button class="key" type="button" data-key="3">3<small>DEF</small></button>
      <button class="key" type="button" data-key="4">4<small>GHI</small></button>
      <button class="key" type="button" data-key="5">5<small>JKL</small></button>
      <button class="key" type="button" data-key="6">6<small>MNO</small></button>
      <button class="key" type="button" data-key="7">7<small>PQRS</small></button>
      <button class="key" type="button" data-key="8">8<small>TUV</small></button>
      <button class="key" type="button" data-key="9">9<small>WXYZ</small></button>
      <span class="key blank"></span>
      <button class="key" type="button" data-key="0">0</button>
      <button class="key fn" type="button" data-key="del" aria-label="Delete"><svg class="i"><use href="#i-delete"/></svg></button>
    </div>
  </div>

  <span class="home-indicator" aria-hidden="true"></span>
</main>

<script>
/* prototype: keypad + SMS autofill fill the boxes; the 6th digit continues to 1.4 */
(function () {
  var NEXT = '1.4-location-permission.html';
  var phone = new URLSearchParams(location.search).get('phone');
  if (phone) document.getElementById('sent-to').textContent = phone;

  var boxes = Array.prototype.slice.call(document.querySelectorAll('.otp input'));
  var code = boxes.map(function (b) { return b.value; }).join('');
  var advance = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dur-otp-advance')) * 1000;
  var leaving = false;

  function render() {
    boxes.forEach(function (b, i) {
      b.value = code[i] || '';
      b.classList.toggle('filled', i < code.length);
      b.classList.toggle('is-focused', i === Math.min(code.length, 5) && code.length < 6);
    });
    if (code.length === 6 && !leaving) {
      leaving = true;
      setTimeout(function () { location.href = NEXT; }, advance);
    }
  }
  document.querySelector('.keys').addEventListener('click', function (e) {
    var key = e.target.closest('[data-key]');
    if (!key || leaving) return;
    if (key.dataset.key === 'del') code = code.slice(0, -1);
    else if (code.length < 6) code += key.dataset.key;
    render();
  });
  document.querySelector('.suggest').addEventListener('click', function (e) {
    if (leaving) return;
    code = e.currentTarget.dataset.fill; render();
  });
  document.getElementById('code-form').addEventListener('submit', function (e) {
    e.preventDefault(); location.href = NEXT;
  });

  /* resend countdown */
  var resend = document.getElementById('resend');
  var left, timer;
  function label() {
    resend.textContent = left > 0 ? 'Resend code in 0:' + String(left).padStart(2, '0') : 'Resend code';
    resend.disabled = left > 0;
  }
  function startCountdown() {
    left = 42; label();
    clearInterval(timer);
    timer = setInterval(function () {
      left -= 1; label();
      if (left <= 0) clearInterval(timer);
    }, 1000);
  }
  resend.addEventListener('click', startCountdown);
  startCountdown();
})();
</script>
</body>
</html>
