<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoot · 1.2 Phone number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Shrikhand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../design-system/icons.js"></script>
<style>
/* 1.2 Phone number – layout only. Values: tokens.css. Components: components.css. */
.flow { padding-bottom: var(--space-4); }
.flow .field { margin-top: var(--space-8); }
.flow .screen-footer { margin-top: auto; }
</style>
</head>
<body class="screen-page">

<main class="device" aria-label="1.2 Phone number">
  <div class="statusbar" aria-hidden="true">
    <span>9:41</span>
    <span class="sys">
      <svg class="i"><use href="#i-signal"/></svg>
      <svg class="i"><use href="#i-wifi"/></svg>
      <svg class="i battery"><use href="#i-battery"/></svg>
    </span>
  </div>

  <form class="screen flow" id="phone-form" action="1.3-sms-code.html" novalidate>
    <header class="page-head">
      <nav class="navbar"><a class="back" href="1.1-welcome.html" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></a><span></span><span></span></nav>
      <h1 class="page-title">What’s your phone number?</h1>
      <p class="page-lede">We’ll text you a code to sign in. We never call you.</p>
    </header>

    <div class="field">
      <label class="field-label" for="phone">Phone number</label>
      <div class="phone">
        <button class="prefix" type="button" aria-label="Country code: Finland +358">+358<svg class="i"><use href="#i-chev-d"/></svg></button>
        <input class="input num is-focused" id="phone" name="phone" type="tel" inputmode="none" autocomplete="tel-national" placeholder="40 123 4567" autofocus>
      </div>
    </div>

    <footer class="screen-footer">
      <button class="btn btn-primary" type="submit">Send code</button>
    </footer>
  </form>

  <div class="keyboard" aria-hidden="true">
    <div class="keys">
      <button class="key" type="button" data-key="1">1<small>&nbsp;</small></button>
      <button class="key" type="button" data-key="2">2<small>ABC</small></button>
      <button class="key" type="button" data-key="3">3<small>DEF</small></button>
      <button class="key" type="button" data-key="4">4<small>GHI</small></button>
      <button class="key" type="button" data-key="5">5<small>JKL</small></button>
      <button class="key" type="button" data-key="6">6<small>MNO</small></button>
      <button class="key" type="button" data-key="7">7<small>PQRS</small></button>
      <button class="key" type="button" data-key="8">8<small>TUV</small></button>
      <button class="key" type="button" data-key="9">9<small>WXYZ</small></button>
      <span class="key blank"></span>
      <button class="key" type="button" data-key="0">0</button>
      <button class="key fn" type="button" data-key="del" aria-label="Delete"><svg class="i"><use href="#i-delete"/></svg></button>
    </div>
  </div>

  <span class="home-indicator" aria-hidden="true"></span>
</main>

<script>
/* prototype: the mock keypad types into the field (format 40 123 4567) */
(function () {
  var input = document.getElementById('phone');
  var digits = '';
  function render() {
    input.value = [digits.slice(0, 2), digits.slice(2, 5), digits.slice(5, 10)].filter(Boolean).join(' ');
    input.focus();
  }
  document.querySelector('.keys').addEventListener('click', function (e) {
    var key = e.target.closest('[data-key]');
    if (!key) return;
    var k = key.dataset.key;
    if (k === 'del') digits = digits.slice(0, -1);
    else if (digits.length < 10) digits += k;
    render();
  });
  input.addEventListener('input', function () { digits = input.value.replace(/\D/g, '').slice(0, 10); render(); });
  document.getElementById('phone-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var shown = input.value || input.placeholder;
    location.href = '1.3-sms-code.html?phone=' + encodeURIComponent('+358 ' + shown);
  });
})();
</script>
</body>
</html>
